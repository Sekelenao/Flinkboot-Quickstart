job:
  name: "Flinkboot-Quickstart"
  environment:
    # Execution tuning: lightweight single-slot execution for local dev laptops
    execution:
      runtime-mode: "STREAMING"
      parallelism: 1
      buffer-timeout: "PT0.1S"
    # Periodic checkpointing: showcases live checkpoints in the local Web UI
    checkpointing:
      enabled: true
      interval: "PT10S"
      mode: "EXACTLY_ONCE"
      timeout: "PT1M"
    # Restart strategy: 3 attempts with 5s delay on failure
    restart-strategy:
      type: "FIXED_DELAY"
      fixed-delay:
        attempts: 3
        delay: "PT5S"
    # Local MiniCluster Web UI
    local-web-ui:
      enabled: true
      port: 8080
      bind-address: "localhost"
    # Custom runtime properties
    properties:
      # Disabled here solely for local demo / educational purposes to decouple operators
      # into separate task vertices in the Flink Web UI (so you can visualize Source, Filter, and Map individually).
      # WARNING - DO NOT DO THIS IN PRODUCTION:
      # Operator chaining is a critical Flink performance optimization that executes consecutive operators
      # within the same thread by passing object references directly. Disabling it forces serialization,
      # buffer pooling, and thread-to-thread handoffs, significantly reducing throughput and increasing latency.
      pipeline.operator-chaining.enabled: "false"

source:
  name: "Space Cargo Source"
  parallelism: 1
  rate-per-second: 3.0
  max-items-per-cargo: 3
  # total-records: 100 # Optional (defaults to Long.MAX_VALUE)

forbidden-items:
  name: "Forbidden Items Filter"
  parallelism: 1
  items:
    - "ALIEN_EGG"

alert:
  name: "Customs Alert Map"
  parallelism: 1
  alert-prefix: "🚨 [QUARANTINE ALERT] Intercepted illegal cargo: "

printing-alert-sink:
  name: "Printing Alert Sink"
